<!DOCTYPE html>
<html lang="zh-CN" class="staticrypt-html">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="cache-control" content="no-cache">
  <meta name="expires" content="0">
  <title>给我们的距离</title>
  <style>
    :root{
      --paper:#f8f3ea;
      --paper-2:#fbf8f2;
      --ink:#2a2521;
      --ink-2:#4d463f;
      --muted:#81776c;
      --faint:#a69a8d;
      --coral:#c96d58;
      --line:rgba(42,37,33,.14);
      --line-strong:rgba(42,37,33,.24);
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 18% 18%,rgba(201,109,88,.07),transparent 32%),
        radial-gradient(circle at 82% 74%,rgba(141,158,155,.08),transparent 34%),
        var(--paper);
      font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background-image:radial-gradient(rgba(42,37,33,.13) .55px,transparent .55px);
      background-size:5px 5px;
      mix-blend-mode:multiply;
    }
    .hidden{display:none !important}
    .staticrypt-spinner-container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .staticrypt-spinner{
      width:24px;
      height:24px;
      border:2px solid rgba(201,109,88,.22);
      border-right-color:var(--coral);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .staticrypt-content{
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px 20px;
    }
    .gate{
      position:relative;
      width:min(100%,420px);
      padding:48px 42px 34px;
      border:1px solid var(--line);
      border-radius:3px;
      background:rgba(251,248,242,.88);
      box-shadow:0 28px 80px rgba(68,53,40,.08);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }
    .gate::before,.gate::after{
      content:"";
      position:absolute;
      width:22px;
      height:22px;
      border-color:rgba(201,109,88,.45);
      border-style:solid;
    }
    .gate::before{left:13px;top:13px;border-width:1px 0 0 1px}
    .gate::after{right:13px;bottom:13px;border-width:0 1px 1px 0}
    .eyebrow{
      display:flex;
      align-items:center;
      gap:9px;
      margin-bottom:28px;
      color:var(--faint);
      font-family:"Helvetica Neue",Arial,sans-serif;
      font-size:8px;
      letter-spacing:.24em;
    }
    .eyebrow::before{content:"";width:24px;height:1px;background:var(--coral);opacity:.65}
    h1{
      margin:0;
      font-size:clamp(30px,7vw,40px);
      font-weight:500;
      line-height:1.22;
      letter-spacing:.02em;
    }
    .instructions{
      margin:14px 0 0;
      color:var(--muted);
      font-family:"PingFang SC","Hiragino Sans GB",sans-serif;
      font-size:12px;
      line-height:1.9;
      letter-spacing:.04em;
    }
    .rule{height:1px;margin:28px 0 24px;background:var(--line)}
    .field{position:relative;display:block}
    .field input{
      width:100%;
      height:48px;
      padding:0 62px 0 15px;
      border:1px solid var(--line-strong);
      border-radius:3px;
      outline:0;
      background:rgba(255,255,255,.34);
      color:var(--ink);
      font-family:"Helvetica Neue",Arial,sans-serif;
      font-size:14px;
      letter-spacing:.06em;
      transition:border-color .2s,background .2s,box-shadow .2s;
    }
    .field input:focus{border-color:rgba(201,109,88,.62);background:rgba(255,255,255,.58);box-shadow:0 0 0 3px rgba(201,109,88,.08)}
    .field input::placeholder{color:var(--faint);letter-spacing:.05em}
    .toggle{
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);
      padding:8px 6px;
      border:0;
      background:transparent;
      color:var(--muted);
      font-family:"PingFang SC","Hiragino Sans GB",sans-serif;
      font-size:10px;
      cursor:pointer;
    }
    .toggle:hover{color:var(--coral)}
    .remember{
      display:flex;
      align-items:center;
      gap:8px;
      margin:14px 0 20px;
      color:var(--muted);
      font-family:"PingFang SC","Hiragino Sans GB",sans-serif;
      font-size:10px;
      letter-spacing:.03em;
      cursor:pointer;
    }
    .remember.hidden{display:none}
    .remember input{accent-color:var(--coral);margin:0}
    .submit{
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:100%;
      height:48px;
      padding:0 18px;
      border:1px solid var(--coral);
      border-radius:3px;
      background:var(--coral);
      color:#fff;
      font-family:"PingFang SC","Hiragino Sans GB",sans-serif;
      font-size:12px;
      letter-spacing:.12em;
      cursor:pointer;
      transition:background .2s,border-color .2s,transform .2s;
    }
    .submit:hover{background:#ba5f4b;border-color:#ba5f4b;transform:translateY(-1px)}
    .submit span{font-size:16px;font-weight:300}
    .error{min-height:17px;margin:11px 0 0;color:var(--coral);font-family:"PingFang SC","Hiragino Sans GB",sans-serif;font-size:10px;line-height:1.6}
    .foot{margin:27px 0 0;color:var(--faint);font-family:"Helvetica Neue",Arial,sans-serif;font-size:8px;letter-spacing:.14em;text-align:center}
    @media(max-width:480px){
      .staticrypt-content{padding:22px 14px}
      .gate{padding:40px 26px 30px}
      .eyebrow{margin-bottom:23px}
      h1{font-size:32px}
      .rule{margin:24px 0 21px}
    }
  </style>
</head>

    </section>
  </main>

    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const password = document.getElementById("staticrypt-password").value;
      const isRememberChecked = document.getElementById("staticrypt-remember").checked;
      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
      if (!isSuccessful) document.getElementById("staticrypt-error").textContent = templateError;
    });
  </script>
</body>
